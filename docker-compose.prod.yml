# StudyMap AI — AWS EC2 production stack, backend-only.
#
# Frontend stays permanently on Render Static Site (unchanged, out of scope
# here). Only the backend (Flask/Gunicorn monolith, unchanged app code) runs
# on EC2. No nginx, no frontend container, no Certbot — those all existed to
# serve the frontend and terminate TLS for it; neither is this compose
# file's job anymore. If TLS termination in front of the backend is needed,
# it belongs in front of this compose stack (e.g. an ALB with an ACM
# certificate) rather than inside it — deliberately out of scope, see
# docs/AWS_DEPLOYMENT.md.
#
# Mirrors render.yaml's production posture (remote AI only: FPT AI +
# Gemini), not docker-compose.yml's local-model dev defaults. See
# AWS_DEPLOYMENT_PLAN.md for the reasoning.
#
# Run from the repo root with an explicit env file:
#   docker compose -f docker-compose.prod.yml --env-file /opt/memvid/env/.env up -d
# (scripts/deploy.sh already does this).
#
# mindmap-worker: the Guided Mind Map V3 background worker. Same image/build
# as backend (no separate Dockerfile), same host, zero new AWS resources —
# just a second container. GUIDED_MINDMAP_V3_ENABLED defaults to "false" in
# app code when unset, so this container is safe to run even before the
# rollout flag/QA allowlist is turned on: it will simply find nothing to
# claim. No public port. See BE/app/jobs/guided_worker.py.

services:
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: memvid_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - /opt/memvid/env/.env
    environment:
      # Fixed production defaults — not left to whatever .env may or may not set.
      DATA_DIR: /app
      PORT: "8080"
      WEB_CONCURRENCY: "1"
      GUNICORN_TIMEOUT: "120"
      JOBS_DB_PATH: /app/memory/jobs.sqlite
      LOG_DB_PATH: /app/memory/logs.sqlite
      CONVERSATIONS_DB_PATH: /app/memory/conversations.sqlite
      USERS_DB_PATH: /app/memory/users.sqlite
      PROCESS_ROLE: web
    volumes:
      - /opt/memvid/data/index:/app/index
      - /opt/memvid/data/memory:/app/memory
      - /opt/memvid/data/input_docs:/app/input_docs
      # LangGraph HITL checkpointer (query/ingest/summary/mindmap graphs) writes
      # DATA_DIR/checkpoints.sqlite directly — not under /app/memory. Bind-mount
      # the file itself so it isn't silently ephemeral. scripts/deploy.sh
      # creates the host file automatically before first `up` — see
      # docs/AWS_DEPLOYMENT.md.
      - /opt/memvid/data/memory/checkpoints.sqlite:/app/checkpoints.sqlite
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      # AI-heavy imports (embeddings, LangChain, etc.) push real startup to
      # 70-90s; 15s made Docker start counting failures toward "unhealthy"
      # while the backend was still loading. scripts/health.sh polls Docker's
      # own status too, so this just keeps `docker inspect` honest with reality.
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mindmap-worker:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: memvid_mindmap_worker
    command: ["python", "-m", "app.jobs.guided_worker"]
    restart: unless-stopped
    env_file:
      - /opt/memvid/env/.env
    environment:
      DATA_DIR: /app
      PROCESS_ROLE: mindmap-worker
      GUIDED_JOB_STORE_BACKEND: postgres
      # Without this, log_db_path() falls back to DATA_DIR/logs.sqlite = /app/logs.sqlite,
      # which is NOT under the /app/memory bind mount below — ephemeral, container-local,
      # invisible to `backend`'s node_logs reads. backend already sets this explicitly
      # (see its environment block above); the worker needs the same value to share it.
      LOG_DB_PATH: /app/memory/logs.sqlite
    volumes:
      # Same durable data as backend — the worker reads/writes index and memory
      # for the same sources the web process serves.
      - /opt/memvid/data/index:/app/index
      - /opt/memvid/data/memory:/app/memory
      - /opt/memvid/data/input_docs:/app/input_docs
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
