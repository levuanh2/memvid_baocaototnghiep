# Production auto-deploy — backend only, EC2.
#
# Triggered by the completion of the "CI" workflow (.github/workflows/ci.yml),
# not by `push` directly — this is how deploy stays wired to "all CI jobs
# passed" without duplicating or modifying ci.yml's job list. `workflow_run`
# fires for every CI run regardless of branch (main pushes AND PR branches),
# so the branch/event filter below is what actually enforces "main only,
# never feature branches" — ci.yml itself needs no changes.
#
# SSH host key is PINNED, not fetched at runtime: EC2_KNOWN_HOSTS holds the
# exact output of a one-time `ssh-keyscan -H <host>` run by a human, written
# straight to known_hosts (StrictHostKeyChecking stays "yes"). The workflow
# never queries the server for its key — see docs/AWS_DEPLOYMENT.md for how
# to generate that secret once (EC2_HOST/EC2_USER/EC2_SSH_KEY/EC2_KNOWN_HOSTS).

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy backend to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # Both conditions matter: `head_branch == 'main'` scopes to main (a PR's
    # CI run has head_branch == the PR's source branch, never "main", unless
    # the PR itself is main -> main which GitHub doesn't allow); `event ==
    # 'push'` additionally excludes any pull_request-triggered CI run even
    # in an edge case where head_branch alone wouldn't. conclusion ==
    # 'success' is the actual "all CI jobs passed" gate — workflow_run's
    # conclusion is only 'success' when every job in that run succeeded.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    steps:
      - name: Checkout verified deploy scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: scripts
          persist-credentials: false

      - name: Resolve verified SHA
        id: gate
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_REPO: ${{ github.event.workflow_run.repository.full_name }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          EXPECTED_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          remote_line="$(git ls-remote "https://github.com/${EXPECTED_REPO}.git" refs/heads/main || true)"
          read -r remote_main_sha _ <<< "$remote_line"
          set +e
          gate_output="$(REMOTE_MAIN_SHA="${remote_main_sha:-}" bash scripts/deploy_gate.sh)"
          gate_status=$?
          set -e
          printf '%s\n' "$gate_output"
          case "$gate_status:$gate_output" in
            0:decision=deploy\ *)
              echo "decision=deploy" >> "$GITHUB_OUTPUT"
              echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
              echo "verified_sha=$RUN_SHA remote_main_sha=$remote_main_sha"
              ;;
            10:decision=skip\ *)
              echo "decision=skip" >> "$GITHUB_OUTPUT"
              echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
              echo "verified_sha=$RUN_SHA remote_main_sha=$remote_main_sha"
              echo "::notice::Deployment skipped because main advanced; the newer commit's CI run owns deployment."
              ;;
            *)
              echo "::error::Deployment gate rejected the workflow_run ($gate_output)."
              exit 1
              ;;
          esac

      - name: Write pinned EC2 host key to known_hosts
        if: steps.gate.outputs.decision == 'deploy'
        env:
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Install deploy SSH key
        if: steps.gate.outputs.decision == 'deploy'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy over SSH
        id: remote_deploy
        if: steps.gate.outputs.decision == 'deploy'
        env:
          DEPLOY_SHA: ${{ steps.gate.outputs.sha }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          set +e
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "${EC2_USER}@${EC2_HOST}" "bash -s -- $DEPLOY_SHA" < scripts/deploy_remote.sh
          deploy_status=$?
          set -e
          if [ "$deploy_status" -eq 75 ]; then
            echo "outcome=superseded" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped because main advanced on the server before migration or activation."
            exit 0
          fi
          if [ "$deploy_status" -ne 0 ]; then
            echo "::error::Pinned deployment failed with exit $deploy_status."
            exit "$deploy_status"
          fi
          echo "outcome=deployed" >> "$GITHUB_OUTPUT"

      - name: Report deployment result
        if: always()
        env:
          GATE_DECISION: ${{ steps.gate.outputs.decision }}
          REMOTE_OUTCOME: ${{ steps.remote_deploy.outputs.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$GATE_DECISION" = "skip" ] || [ "$REMOTE_OUTCOME" = "superseded" ]; then
            echo "Deployment skipped safely because the verified SHA was superseded."
          elif [ "$JOB_STATUS" = "success" ]; then
            echo "Pinned deployment succeeded."
          else
            echo "Pinned deployment FAILED — see the preceding gate/SSH step for the exact error." >&2
          fi
