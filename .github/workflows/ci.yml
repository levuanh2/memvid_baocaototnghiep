name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------------------------------------------------------------
  # Backend test suite (the real one — pytest, not just an import).
  #
  # Postgres runs as a service container: `tests/conftest.py` talks to
  # the `documents` / `users` tables through SQLAlchemy, and without a
  # live DB ~96 tests fail with `assert 500 == 201` or blow up inside
  # psycopg. A throwaway container is free on GitHub-hosted runners and
  # keeps the suite off anybody's Supabase project.
  #
  # SKIP_MODEL_LOAD=1 is what the suite already uses (see conftest):
  # embeddings become FakeEmbeddings, so CI never downloads torch
  # weights, never needs a GPU, and never starts Ollama.
  # ---------------------------------------------------------------
  backend-tests:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studymap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SKIP_MODEL_LOAD: "1"
      # Plain `postgresql://` is fine — app/db/__init__.py rewrites it to
      # `postgresql+psycopg://` because psycopg2 is not installed.
      #
      # Only TEST_DATABASE_URL lives at job scope. DATABASE_URL is set per-step,
      # on the two steps that are not pytest (migrations, gunicorn smoke boot),
      # so that during `pytest` there is no production-shaped URL in the
      # environment at all. `app/db.database_url()` refuses to fall back to
      # DATABASE_URL under pytest — that fallback is exactly how the local suite
      # wrote to, and hard-deleted from, the production database for weeks:
      # BE/.env supplies DATABASE_URL and conftest never overrode it.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studymap_test
      # Stops shared/env_loader from setdefault-ing the USE_LC_* flags, so the
      # suite reads the same flag values it does locally. conftest sets this for
      # itself too; declaring it here also covers tests that never build the
      # `client` fixture.
      #
      # No API keys are set anywhere in this workflow, and none are needed:
      # with no GEMINI_API_KEY / GROQ_API_KEY, llm_factory falls back to the
      # ollama provider, and every heavy call is mocked by conftest.
      MEMVID_DISABLE_LC_DEFAULTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: BE/requirements.txt

      - name: Install dependencies
        working-directory: BE
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # gen/ is gitignored, so a fresh clone has no gRPC stubs. Nothing on the
      # boot path imports them (the gateway clients are lazy, behind
      # LLM_GATEWAY_ADDR), but generating them keeps parity with BE/Dockerfile.
      - name: Generate gRPC stubs
        working-directory: BE
        run: python scripts/build_proto.py

      - name: Run migrations
        working-directory: BE
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studymap_test
        run: alembic upgrade head

      - name: Run backend test suite
        working-directory: BE
        run: python -m pytest -q

      # Boots the app the way Render does (gunicorn -> app.main:app) and hits
      # the health path named in render.yaml. Catches "imports fine, dies on
      # boot" and "healthCheckPath points at nothing" before a deploy does.
      - name: Smoke boot under gunicorn + health check
        working-directory: BE
        env:
          # Same shape as the Render Free service: no Ollama, no local weights.
          OLLAMA_HOST: ""
          SKIP_MODEL_LOAD: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studymap_test
        run: |
          gunicorn -w 1 -b 127.0.0.1:8080 --timeout 120 app.main:app &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              echo "up after ${i} tries"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health
          echo
          kill "$pid" || true

  # ---------------------------------------------------------------
  # Frontend: tests + production build.
  # ---------------------------------------------------------------
  frontend:
    name: Frontend Tests & Build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      # Reported, never blocking. The repo carries a known, pre-existing
      # eslint backlog; fixing it is deliberately out of scope for the
      # deployment work, and failing CI on it would only hide new problems
      # behind old ones. Read the annotation, don't ignore the step.
      - name: Lint (report only — known pre-existing debt)
        run: npm run lint
        continue-on-error: true

  # ---------------------------------------------------------------
  # Pre-existing jobs, kept as they were.
  # ---------------------------------------------------------------
  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest

    # Compose nội suy TOÀN BỘ file trước mọi lệnh, kể cả `build`, nên
    # `${DATABASE_URL:?}` ở docker-compose.yml làm `docker compose build` dừng trước khi
    # build. Build KHÔNG kết nối DB — giá trị giả dưới đây chỉ để thoả mãn nội suy.
    # KHÔNG phải secret, không trỏ tới hệ thống nào có thật.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_build_only

    steps:
      - uses: actions/checkout@v4

      - name: Docker build backend
        run: docker build -t memvid-backend -f BE/Dockerfile ./BE

      - name: Docker build frontend
        run: docker build -t memvid-frontend -f FE/Dockerfile .

      - name: Docker compose build
        run: docker compose build

  docker-compose-run-test:
    name: Docker Compose Run Test
    runs-on: ubuntu-latest
    needs: docker-build-test

    # Cùng lý do với job trên: `docker compose up` cũng nội suy cả file trước khi chạy.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_build_only

    steps:
      - uses: actions/checkout@v4

      - name: Docker compose up
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          echo "Waiting for backend to be ready..."
          for i in {1..40}; do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "Backend is up!"
              exit 0
            fi
            echo "Retry $i..."
            sleep 2
          done
          echo "Backend did not become ready in time"
          exit 1

      - name: Healthcheck
        run: curl -fsS http://localhost:8080/health

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Down
        if: always()
        run: docker compose down -v
