name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Concurrency control:
# - PRs: cancel outdated in-progress runs when a new commit is pushed.
# - main branch: cancel-in-progress is FALSE to ensure deploy is never disrupted midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Stage 0: Change Detection & Path Filtering
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'FE/**'
              - 'package*.json'
            backend:
              - 'BE/**'
              - 'scripts/**'
            shared:
              - '.github/**'
              - 'docker-compose*'
              - '*.yml'
              - '*.yaml'
              - 'alembic/**'

  # ---------------------------------------------------------------------------
  # Stage 1: Security & Static Integrity
  # ---------------------------------------------------------------------------
  security-and-static:
    name: Security & Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Git Whitespace and Diffs
        run: git diff --check

      - name: Scan for Accidental Secrets & Private Keys
        run: |
          echo "Scanning for accidental committed private keys or production secrets..."
          if grep -rn --exclude-dir={.git,node_modules,dist,__pycache__} -E "BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY" .; then
            echo "::error::Found private key committed in repository!"
            exit 1
          fi
          echo "Secret check passed."

      # Gates only NEW critical/high advisories introduced by THIS PR's own
      # dependency changes (npm + pip manifests) — GitHub diffs against the
      # base branch itself, so pre-existing/accepted advisories (documented
      # debt, see docs/ci/CI_ARCHITECTURE.md §9) never fail this. PR-only:
      # the action needs a base ref to diff against.
      - name: Dependency Review (new critical/high advisories only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ---------------------------------------------------------------------------
  # Stage 2: Frontend Pipeline (Vitest, Lint, Vite Build)
  # ---------------------------------------------------------------------------
  frontend-tests:
    name: Frontend Tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: >
      github.ref == 'refs/heads/main' ||
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    defaults:
      run:
        working-directory: FE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests (Vitest)
        run: npm test

      # Reported, never blocking. The repo carries a known, pre-existing
      # eslint backlog; fixing it is out of scope for CI stabilization.
      - name: Lint (report only — known pre-existing debt)
        run: npm run lint
        continue-on-error: true

      # Ratchet: fails only if the TOTAL problem count grows past the
      # committed baseline (FE/.eslint-baseline.json). Pre-existing debt
      # stays allowed; new debt does not. See FE/scripts/lint-ratchet.mjs.
      - name: Lint ratchet (blocking — no NEW problems beyond baseline)
        run: npm run lint:ratchet

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes, frontend-tests]
    if: >
      github.ref == 'refs/heads/main' ||
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    defaults:
      run:
        working-directory: FE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend production bundle
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: FE/dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage 3: Backend Pipeline (Proto, Unit, Contracts, DB & Integration)
  # ---------------------------------------------------------------------------
  backend-contracts-and-unit:
    name: Backend Unit & Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: >
      github.ref == 'refs/heads/main' ||
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    defaults:
      run:
        working-directory: BE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: BE/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate gRPC stubs
        run: python scripts/build_proto.py

      - name: Compile check (app.main)
        run: python -m py_compile app/main.py

      - name: Run fast contract & regression tests
        run: python -m pytest -q tests/test_ci_contracts.py tests/test_ci_regressions.py

      # Existing/accepted advisories are documented debt (see
      # docs/ci/CI_ARCHITECTURE.md §9), never silently suppressed — this
      # report-only step keeps them visible without turning CI permanently
      # red over pre-existing, untriaged findings. New critical/high
      # advisories on a PR's OWN dependency changes are instead gated by
      # dependency-review-action in security-and-static (diffs against base).
      - name: pip-audit (report only — pre-existing debt tracked, not gated here)
        run: |
          pip install --quiet pip-audit
          pip-audit -r requirements.txt || echo "::warning::pip-audit found pre-existing advisories — see docs/ci/CI_ARCHITECTURE.md §9"
        continue-on-error: true

  backend-integration-and-smoke:
    name: Backend Integration Suite & Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, backend-contracts-and-unit]
    if: >
      github.ref == 'refs/heads/main' ||
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.shared == 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studymap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SKIP_MODEL_LOAD: "1"
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studymap_test
      REDIS_URL: redis://localhost:6379/0
      MEMVID_DISABLE_LC_DEFAULTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: BE/requirements.txt

      - name: Install dependencies
        working-directory: BE
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate gRPC stubs
        working-directory: BE
        run: python scripts/build_proto.py

      - name: Run migrations
        working-directory: BE
        run: alembic upgrade head

      - name: Run full backend test suite
        working-directory: BE
        run: python -m pytest -q --junitxml=reports/backend-junit.xml

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit-report
          path: BE/reports/backend-junit.xml
          retention-days: 14

      - name: Smoke boot under gunicorn + health check
        working-directory: BE
        env:
          OLLAMA_HOST: ""
          SKIP_MODEL_LOAD: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studymap_test
        run: |
          gunicorn -w 1 -b 127.0.0.1:8080 --timeout 120 app.main:app &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              echo "up after ${i} tries"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health
          echo
          kill "$pid" || true

  # ---------------------------------------------------------------------------
  # Stage 3.5: Deterministic Browser E2E (Playwright, real FE + real BE)
  # ---------------------------------------------------------------------------
  e2e-critical:
    name: E2E Critical Flows (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, frontend-build, backend-integration-and-smoke]
    if: >
      github.ref == 'refs/heads/main' ||
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.shared == 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studymap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SKIP_MODEL_LOAD: "1"
      MEMVID_DISABLE_LC_DEFAULTS: "1"
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studymap_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studymap_test
      # Scoped to THIS job only — never written to a real .env, never the
      # project-wide default (which stays false). See BE/scripts/run_e2e_server.py.
      GUIDED_MINDMAP_V3_ENABLED: "true"
      GUIDED_JOB_STORE_BACKEND: "sqlite"
      PORT: "8080"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: BE/requirements.txt

      - name: Install backend dependencies
        working-directory: BE
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate gRPC stubs
        working-directory: BE
        run: python scripts/build_proto.py

      - name: Run migrations
        working-directory: BE
        run: alembic upgrade head

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FE/package-lock.json

      - name: Install frontend dependencies
        working-directory: FE
        run: npm ci

      - name: Build frontend pointed at the local E2E backend
        working-directory: FE
        env:
          VITE_API_URL: http://127.0.0.1:8080
        run: npm run build

      - name: Install Playwright browsers
        working-directory: FE
        run: npx playwright install --with-deps chromium

      - name: Run Playwright critical-flow suite
        working-directory: FE
        run: npx playwright test

      - name: Upload Playwright report & traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            FE/playwright-report/
            FE/test-results/
          retention-days: 10

  # ---------------------------------------------------------------------------
  # Stage 4: Docker & Compose Validation (Main or Shared Infra PRs)
  # ---------------------------------------------------------------------------
  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: >
      github.ref == 'refs/heads/main' ||
      needs.detect-changes.outputs.shared == 'true'

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_build_only

    steps:
      - uses: actions/checkout@v4

      - name: Docker build backend
        run: docker build -t memvid-backend -f BE/Dockerfile ./BE

      - name: Docker build frontend
        run: docker build -t memvid-frontend -f FE/Dockerfile .

      - name: Docker compose build
        run: docker compose build

  docker-compose-run-test:
    name: Docker Compose Run Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build-test

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_build_only

    steps:
      - uses: actions/checkout@v4

      - name: Docker compose up
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          echo "Waiting for backend to be ready..."
          for i in {1..40}; do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "Backend is up!"
              exit 0
            fi
            echo "Retry $i..."
            sleep 2
          done
          echo "Backend did not become ready in time"
          exit 1

      - name: Healthcheck
        run: curl -fsS http://localhost:8080/health

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Stage 5: Aggregate Status Gate for Branch Protection
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI / required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - security-and-static
      - frontend-tests
      - frontend-build
      - backend-contracts-and-unit
      - backend-integration-and-smoke
      - e2e-critical
      - docker-build-test
      - docker-compose-run-test
    steps:
      - name: Evaluate Aggregate CI Results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Pipeline job results: $results"

          # If any executed job failed or was cancelled, fail the aggregate gate
          for res in $results; do
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "::error::One or more required CI jobs did not succeed."
              exit 1
            fi
          done

          echo "All active CI checks succeeded."
          exit 0
