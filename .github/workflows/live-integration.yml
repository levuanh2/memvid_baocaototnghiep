name: Live Provider Integration

on:
  schedule:
    # Run once a week on Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      test_fpt:
        description: 'Request FPT probe (not implemented; reports skipped)'
        required: false
        default: true
        type: boolean
      test_ec2_health:
        description: 'Test AWS EC2 deployed instance health'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  live-providers-probe:
    name: Probe Live External Providers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Record FPT probe status
        id: fpt-probe
        if: ${{ github.event_name == 'schedule' || inputs.test_fpt }}
        run: |
          echo "status=SKIPPED_NOT_IMPLEMENTED" >> "$GITHUB_OUTPUT"
          echo "::notice::FPT live connectivity was requested, but this workflow does not implement an FPT probe."

      - name: Record disabled FPT probe
        id: fpt-disabled
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.test_fpt }}
        run: echo "status=SKIPPED_DISABLED" >> "$GITHUB_OUTPUT"

      - name: Probe Live EC2 Backend Health
        id: ec2-probe
        if: ${{ github.event_name == 'schedule' || inputs.test_ec2_health }}
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -z "${EC2_HOST:-}" ]; then
            echo "status=SKIPPED_MISSING_SECRET" >> "$GITHUB_OUTPUT"
            echo "::notice::EC2 health probe skipped because EC2_HOST is not configured."
          elif curl -fsS --connect-timeout 10 --max-time 15 "http://${EC2_HOST}:8080/health" >/dev/null 2>&1; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
            echo "EC2 health probe passed."
          else
            echo "status=FAILED_NON_BLOCKING" >> "$GITHUB_OUTPUT"
            echo "::warning::EC2 health probe timed out or returned an error."
          fi

      - name: Record disabled EC2 probe
        id: ec2-disabled
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.test_ec2_health }}
        run: echo "status=SKIPPED_DISABLED" >> "$GITHUB_OUTPUT"

      - name: Report Live Provider Status
        if: ${{ always() }}
        env:
          FPT_STATUS: ${{ steps.fpt-probe.outputs.status || steps.fpt-disabled.outputs.status || 'UNKNOWN' }}
          EC2_STATUS: ${{ steps.ec2-probe.outputs.status || steps.ec2-disabled.outputs.status || 'UNKNOWN' }}
        run: |
          echo "FPT probe status: ${FPT_STATUS}"
          echo "EC2 probe status: ${EC2_STATUS}"
          {
            echo "## Live Provider Integration"
            echo "| Provider | Status |"
            echo "| --- | --- |"
            echo "| FPT | ${FPT_STATUS} |"
            echo "| EC2 health | ${EC2_STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"
