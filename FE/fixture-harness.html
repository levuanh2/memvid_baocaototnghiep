<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Export Studio Fixture Harness (dev only — not part of the shipped app)</title>
  </head>
  <body>
    <!-- Same SVG filter def index.html carries, for connector rendering parity. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <filter id="mm-sketch" x="-8%" y="-8%" width="116%" height="116%">
          <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="7" result="mm-noise" />
          <feDisplacementMap in="SourceGraphic" in2="mm-noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root" style="height:100vh;width:100vw;"></div>
    <script type="module" src="/src/fixtureHarness.jsx"></script>
  </body>
</html>
