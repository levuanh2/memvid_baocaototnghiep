<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>StudyMap</title>
  <!-- StudyMap mark (V9.3): the brand-gold tile carrying a three-stop knowledge route.
       Two ink stops are concepts already read; the open stop is where the learner is
       going next. Ink on gold, never white on gold. Legible at 16px. -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#F4C44E" />
  <path d="M18 45 L31 20 L46 34" fill="none" stroke="#20211D" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="18" cy="45" r="7" fill="#20211D" />
  <circle cx="31" cy="20" r="7" fill="#20211D" />
  <circle cx="46" cy="34" r="8.5" fill="#FFFFFF" stroke="#20211D" stroke-width="4" />
</svg>
