<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>StudyMap</title>
  <!-- StudyMap mark (V5-A): the seal-red tile of the signature system, carrying a
       three-stop knowledge route instead of the retired "M" + "X" badge.
       Two ivory stops are concepts already read; the ink stop is where the
       learner is going next. Thick strokes and large stops stay legible at 16px. -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#F1333A" />
  <path d="M18 45 L31 20 L46 34" fill="none" stroke="#FAF8F5" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="18" cy="45" r="7" fill="#FAF8F5" />
  <circle cx="31" cy="20" r="7" fill="#FAF8F5" />
  <circle cx="46" cy="34" r="8.5" fill="#1B2A41" stroke="#FAF8F5" stroke-width="4" />
</svg>
