# StudyMap AI — production reverse proxy (runs as its own container, see
# docker-compose.prod.yml's `nginx` service). Public entrypoint: terminates
# TLS, then routes:
#   /api/*  -> backend:8080  (Flask/Gunicorn)
#   /*      -> frontend:3000 (already serves the built SPA with its own
#              try_files fallback — FE/nginx.conf is unchanged, so SPA
#              routing works end-to-end without duplicating that logic here)
#
# Certs come from a host-mounted certbot directory (see docs/AWS_DEPLOYMENT.md
# for the certbot provisioning steps — deliberately not run inside this
# container, so cert renewal never depends on an app image rebuild).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Plain-HTTP health check target — used by the nginx service's own
    # Docker healthcheck and by external uptime monitors before/without TLS.
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/memvid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memvid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    # TLS 1.3 ciphersuites aren't controlled by ssl_ciphers, and modern
    # guidance is to let the client pick among the (already-vetted) list
    # above rather than force server preference.
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    keepalive_timeout 65s;
    client_header_timeout 60s;
    client_body_timeout 60s;

    # Matches FE/nginx.conf's existing upload limit — same app, same ceiling.
    client_max_body_size 200M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    # Security headers (README's own known-debt list names this gap explicitly).
    # CSP intentionally left out here: writing one blind, untested against the
    # real Vite bundle, risks silently breaking the app rather than hardening it.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket/SSE ready — app currently uses SSE (SSE_TIMEOUT_SEC), this
        # also covers a future websocket upgrade without another nginx change.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;

        # Long-running AI calls — matches FE/nginx.conf's existing /api/ timeouts.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    location / {
        proxy_pass http://frontend:3000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
