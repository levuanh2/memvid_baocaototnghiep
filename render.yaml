# ============================================================
# StudyMap AI — Render Blueprint (frontend only)
# ============================================================
# Render Dashboard > Blueprints reads this file and keeps the services below in
# sync with `main`.
#
# Production topology:
#   studymap.space       -> studymap-web (this file, Render static site)
#   api.studymap.space   -> AWS EC2 + Docker Compose (docker-compose.prod.yml,
#                           deployed by .github/workflows/deploy.yml, pinned to
#                           the CI-verified SHA). NOT a Render service.
#
# The old Render backend `studymap-api` was removed from this Blueprint on
# purpose. It was suspended and not serving production, but while it stayed
# here its buildCommand ran production Alembic migrations, so resuming it would
# have migrated the production database from a second deploy path.
#
# Removing a service from a Blueprint does NOT delete it on Render: it becomes
# an unmanaged service with its settings and secrets intact. Deleting it is a
# separate, manual decision. Its old definition (free-tier env, migration
# fence) is in git history and in docs/deployment/render-free.md.
#
# Render prompts for every `sync: false` value:
#   VITE_API_BASE   the production API origin, https://api.studymap.space
#
# NEVER put a real secret in this file — it is committed to git.
# ============================================================

services:
  # ---------- Frontend: static site (free, no instance hours) ----------
  - type: web
    name: studymap-web
    runtime: static
    branch: main
    # Never publish a main commit until all linked GitHub CI checks pass.
    autoDeployTrigger: checksPass
    rootDir: FE
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA fallback: without this, refreshing /app/study/quiz/<id> returns 404.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Vite inlines this at BUILD time — changing it requires a new FE deploy,
      # not just a restart.
      - key: VITE_API_BASE
        sync: false
