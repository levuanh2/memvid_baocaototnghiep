# ============================================================
# StudyMap AI — Render Blueprint (FREE tier)
# ============================================================
# Render Dashboard > New > Blueprint > pick this repo. Render reads this
# file, creates the services, and redeploys on every push to `main`.
#
# Target: Render Free Web Service (~0.5 CPU / 512 MB RAM, ephemeral disk,
# spins down after ~15 min idle). Everything below is shaped by those three
# limits. The paid configuration this file used to hold is written down in
# docs/deployment/render-free.md ("Upgrading to paid") — nothing was lost,
# it moved.
#
# Render prompts for every `sync: false` value when you create the blueprint:
#   DATABASE_URL         Supabase > Settings > Database > Connection string.
#                        Use the SESSION pooler (port 5432). The transaction
#                        pooler (6543) cannot run alembic's multi-statement DDL.
#                        Percent-encode the password: '#' -> '%23'.
#   SUPABASE_URL         https://<project_ref>.supabase.co
#   SUPABASE_SECRET_KEY  Supabase > Settings > API keys > secret key
#   GEMINI_API_KEY       Google AI Studio. Render cannot run Ollama, so this
#                        is the only LLM provider on this deployment.
#   VITE_API_BASE        (on studymap-web) the studymap-api URL once it exists,
#                        e.g. https://studymap-api.onrender.com
#
# NEVER put a real secret in this file — it is committed to git.
# ============================================================

services:
  # ---------- Backend: Flask + Gunicorn ----------
  - type: web
    name: studymap-api
    runtime: python
    plan: free
    # Supabase project sits in ap-northeast-2 (Seoul); singapore is the nearest
    # Render region, which keeps DB round-trips off the critical path.
    region: singapore
    branch: main
    autoDeploy: true
    rootDir: BE
    healthCheckPath: /health

    # `preDeployCommand` is a paid-plan feature, so migrations run here instead.
    # Build-time is the right place on free: a failed migration fails the build
    # and Render keeps the previous deploy serving. Putting it in startCommand
    # would re-run it on every cold start and take the service down on failure.
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python scripts/build_proto.py &&
      alembic upgrade head

    # Production WSGI server, never `flask run`. One worker: HITL keeps resume
    # metadata in-process, so pause and resume must land in the same process —
    # and 512 MB does not fit a second worker anyway.
    startCommand: >-
      gunicorn -w ${WEB_CONCURRENCY:-1} -b 0.0.0.0:${PORT:-8080}
      --timeout ${GUNICORN_TIMEOUT:-120} app.main:app

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

      # --- secrets: Render asks for these at blueprint creation ---
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Token signing key: generated once by Render, never shown, never in git.
      - key: AUTH_SECRET
        generateValue: true

      # --- THE free-tier switch -------------------------------------------
      # No local model weights, ever. get_embeddings() returns FakeEmbeddings
      # instead of pulling a sentence-transformers checkpoint, so boot needs no
      # download and no ~470 MB+ of resident model on a 512 MB box.
      #
      # The cost is real and is NOT hidden: embedding-backed retrieval (RAG chat
      # citations, semantic search, ingest indexing) does not produce meaningful
      # results on this deployment. Gemini-backed generation does work. See the
      # "What does not work on Free" section of docs/deployment/render-free.md.
      - key: SKIP_MODEL_LOAD
        value: "1"

      # --- state: ephemeral on free, so keep it off the local disk ----------
      # No Persistent Disk exists on free. DATA_DIR points at the container's
      # own filesystem and is wiped on every deploy, restart and spin-down.
      # Business data lives in Postgres (Supabase); uploads live in Supabase
      # Storage. FAISS index files and the sqlite job/log ledgers do not survive.
      # HF_HOME and USERS_DB_PATH are deliberately absent: no code reads
      # USERS_DB_PATH (accounts live in Postgres), and SKIP_MODEL_LOAD=1 means
      # nothing ever populates a HuggingFace cache. Setting either would be
      # config that looks load-bearing and is not.
      - key: DATA_DIR
        value: /tmp/studymap
      - key: JOBS_DB_PATH
        value: /tmp/studymap/jobs.sqlite
      - key: LOG_DB_PATH
        value: /tmp/studymap/logs.sqlite
      - key: CONVERSATIONS_DB_PATH
        value: /tmp/studymap/conversations.sqlite

      # --- LLM: Gemini only, no Ollama -------------------------------------
      # An EMPTY OLLAMA_HOST is required, not cosmetic: llm_factory only drops
      # "ollama" from PROVIDERS when this is blank. Leave it at its default and
      # every LLM call tries Ollama first, waits for the timeout, then falls
      # through to Gemini.
      - key: OLLAMA_HOST
        value: ""
      - key: OLLAMA_WARMUP
        value: "0"
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: LLM_MAX_TOKENS
        value: "8192"
      # Free spins down and has one slow CPU; generous per-call ceilings, but
      # below the gunicorn worker timeout so a hung call dies as a request error
      # rather than as a killed worker.
      - key: AI_TIMEOUT_SEC
        value: "110"
      - key: SUMMARY_LLM_TIMEOUT_SEC
        value: "110"
      - key: MINDMAP_LLM_TIMEOUT_SEC
        value: "110"
      - key: QUIZ_LLM_TIMEOUT_SEC
        value: "110"

      # --- retrieval: every LOCAL-model feature off -------------------------
      # The rule here is "no model weights in this process", not "no reranking".
      # NLI (~0.4 GB) still lazy-loads on first query, so leaving it on would OOM
      # mid-request rather than at boot — the worst place to find out. FPT has no
      # NLI/zero-shot model, so it stays off.
      - key: NLI_ENABLED
        value: "0"
      # Reranking is back ON because it no longer loads anything. The local
      # cross-encoder (bge-reranker-v2-m3, ~2.3 GB) was the reason this was "0";
      # the FPT backend calls the SAME model over HTTP and allocates nothing here.
      - key: RERANK_ENABLED
        value: "1"
      - key: RERANK_BACKEND
        value: fpt
      # Marketplace uses the bare model name; RERANK_MODEL carries the HuggingFace
      # name ("BAAI/bge-reranker-v2-m3"). Same model, two naming conventions —
      # passing the wrong one gets a 404 from FPT.
      - key: FPT_AI_RERANK_MODEL
        value: bge-reranker-v2-m3
      # Embedding runs on FPT over HTTP, so it allocates nothing in this process and
      # `get_embeddings()` checks it BEFORE SKIP_MODEL_LOAD. Setting this turns real
      # embedding on for documents ingested from here on — it does NOT touch anything
      # already in the database, and it does NOT rebuild an index. The existing 189
      # chunks stay unembedded because nothing walks them: rebuild is a manual script,
      # and every document currently in the corpus is blocked by the allowlist.
      - key: FPT_AI_EMBEDDING_MODEL
        value: Vietnamese_Embedding
      # Late chunking needs a long-context encoder; nothing is loaded here.
      - key: LATE_CHUNKING
        value: "0"

      # --- retrieval index: restore from Supabase at boot --------------------
      # Free tier wipes /tmp on every restart, so an index built here dies with the
      # instance. With this on, boot pulls the published index for the CURRENT
      # embedding identity from Supabase Storage (index/<provider>__<model>__
      # <strategy>/current.json -> manifest -> artifacts, sha256-checked).
      #
      # This restores; it never rebuilds. Rebuilding stays a manual script
      # (scripts/dung_lai_index_tu_postgres.py) so no boot can silently spend money
      # on embedding, and so an index only ever contains allowlisted documents.
      - key: INDEX_PERSISTENCE_ENABLED
        value: "1"

      # --- provenance: which process ingested a document ---------------------
      # Written by the server into documents.metadata_json at row creation, never
      # taken from a request. It is the third condition for index eligibility, next
      # to the two human decisions in production_index_allowlist.json — see
      # app/domains/documents/provenance.py. Absent or misspelled means "not
      # production", and pytest overrides it regardless of what is set here.
      - key: INGEST_ORIGIN
        value: production
      - key: EMBEDDING_WARMUP_ENABLED
        value: "0"
      - key: HYBRID_TOP_K
        value: "6"
      - key: CRAG_ENABLED
        value: "0"
      # Answers go straight out; no human-approval pause.
      - key: HITL_ENABLED
        value: "0"

      # --- server ----------------------------------------------------------
      - key: WEB_CONCURRENCY
        value: "1"
      # Must stay under Render's own request ceiling and above the LLM timeouts.
      - key: GUNICORN_TIMEOUT
        value: "120"
      # Auth is Bearer-token, so a cross-origin reader still cannot obtain a
      # token. Tighten to the studymap-web URL once it is known.
      - key: CORS_ORIGINS
        value: "*"

      # --- auth: production posture ---------------------------------------
      - key: AUTH_REQUIRE_SECRET
        value: "true"
      - key: AUTH_PROTECT_APP_APIS
        value: "true"
      - key: AUTH_TOKEN_TTL_SEC
        value: "604800"

      # --- no Redis on free: queue and cache fail open ---------------------
      # QUEUE_ENABLED=false runs jobs in in-process daemon threads instead of
      # RQ workers. Same code path, same dotted callables — but a job dies with
      # the instance when free spins down. No Redis service is created here.
      - key: REDIS_URL
        value: ""
      - key: QUEUE_ENABLED
        value: "false"
      - key: CONVERSATION_CONTEXT_ENABLED
        value: "true"
      - key: SUPABASE_STORAGE_BUCKET
        value: documents

  # ---------- Frontend: static site (free, no instance hours) ----------
  - type: web
    name: studymap-web
    runtime: static
    branch: main
    autoDeploy: true
    rootDir: FE
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA fallback: without this, refreshing /app/study/quiz/<id> returns 404.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Vite inlines this at BUILD time — changing it requires a new FE deploy,
      # not just a restart.
      - key: VITE_API_BASE
        sync: false
